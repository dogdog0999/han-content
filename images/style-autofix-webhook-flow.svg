<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="push 到 main 後 GitHub 發 webhook 給 Cloudflare Worker;Worker 驗簽章、檢查是不是自己的 commit,用 ctx.waitUntil 把校正丟到背景並馬上回 202;背景讀檔、AI 校正、逐字比對後 commit 回 repo,這個 push 再打一次 webhook 時會被標記擋掉">
<defs>
