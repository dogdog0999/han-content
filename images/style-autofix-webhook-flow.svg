<line x1="73" y1="228" x2="73" y2="116" stroke="#b98a3e" stroke-dasharray="5 4" marker-end="url(#ay)"/>
</g>
<g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" fill="#2b2f28" text-anchor="middle">
<text x="73" y="84" font-size="13" font-weight="600">GitHub</text>
<text x="73" y="102" font-size="11" fill="#5b6354">push 到 main</text>
<text x="73" y="252" font-size="13" font-weight="600">GitHub</text>
<text x="73" y="270" font-size="11" fill="#5b6354">多一個 commit</text>
<text x="238" y="84" font-size="12">收 webhook</text>
<text x="238" y="101" font-size="12">驗 HMAC 簽章</text>
<text x="399" y="84" font-size="12">commit 訊息含</text>
<text x="399" y="101" font-size="12" font-family="ui-monospace,Consolas,monospace">[style-autofix]?</text>
<text x="567" y="84" font-size="12" font-family="ui-monospace,Consolas,monospace">ctx.waitUntil</text>
<text x="567" y="101" font-size="12">丟進背景</text>
<text x="714" y="93" font-size="12.5">回 202</text>
<text x="238" y="261" font-size="12">讀檔(GitHub API)</text>
<text x="379" y="261" font-size="12.5">AI 校正</text>
<text x="517" y="261" font-size="12.5">逐字比對</text>
<text x="665" y="261" font-size="12">commit 回 repo</text>
