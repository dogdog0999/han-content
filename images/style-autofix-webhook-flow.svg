<text x="486" y="80">沒有</text>
<text x="380" y="316">commit 訊息帶 [style-autofix]</text>
</g>
<g text-anchor="start">
<text x="772" y="38" font-size="11.5" font-weight="600" fill="#8a8670" text-anchor="end">Cloudflare Worker</text>
<text x="180" y="38" font-size="12" font-weight="600" fill="#5b6354">① 同步:要在逾時前回完</text>
<text x="409" y="40" font-size="10.5" font-weight="600" fill="#b98a3e">有 → 直接結束(防迴圈)</text>
<text x="252" y="182" font-size="12" font-weight="600" fill="#b98a3e">② 背景:202 回完之後繼續做</text>
<text x="82" y="168" font-size="10.5" fill="#b98a3e">這次 push</text>
<text x="82" y="182" font-size="10.5" fill="#b98a3e">又發 webhook</text>
<text x="82" y="196" font-size="10.5" fill="#b98a3e">→ 被擋掉</text>
</g>
</g>
</svg>
