<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="原架構在 VPS 上跑運算，新架構把 embedding 外移到 NVIDIA、排序交給 Cloudflare Worker，VPS 不參與。">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6354"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="560" fill="#fbfbf3"/>

  <!-- ===== 原架構 ===== -->
  <text x="30" y="40" font-size="17" font-weight="700" fill="#2d5139">原架構 ── VPS 自己扛運算</text>

  <!-- 瀏覽器 -->
  <rect x="30" y="70" width="140" height="72" rx="12" fill="#f1f0e6" stroke="#5b6354" stroke-width="1.3"/>
  <text x="100" y="101" font-size="15" font-weight="700" fill="#232a20" text-anchor="middle">瀏覽器</text>
  <text x="100" y="123" font-size="12.5" fill="#5b6354" text-anchor="middle">使用者打字查詢</text>

  <!-- arrow -->
  <line x1="170" y1="106" x2="258" y2="106" stroke="#5b6354" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="214" y="96" font-size="11.5" fill="#5b6354" text-anchor="middle">查詢</text>

  <!-- VPS old (hot) -->
  <rect x="262" y="62" width="330" height="96" rx="12" fill="#f3e6cf" stroke="#b98a3e" stroke-width="1.6"/>
  <text x="427" y="92" font-size="15" font-weight="700" fill="#232a20" text-anchor="middle">我的 VPS（Oracle 免費方案）</text>
  <text x="427" y="114" font-size="13" fill="#232a20" text-anchor="middle">跑 embedding 推論 ＋ 向量排序</text>
  <text x="427" y="137" font-size="11.5" fill="#8a6220" text-anchor="middle">常駐進程・吃 CPU / RAM・冷啟動 100–300ms</text>

  <!-- divider -->
  <line x1="30" y1="252" x2="730" y2="252" stroke="rgba(35,42,30,.13)" stroke-width="1"/>

  <!-- ===== 新架構 ===== -->
  <text x="30" y="296" font-size="17" font-weight="700" fill="#2d5139">新架構 ── 運算全外移，VPS 不參與</text>

  <!-- 瀏覽器 -->
  <rect x="30" y="326" width="128" height="70" rx="12" fill="#f1f0e6" stroke="#5b6354" stroke-width="1.3"/>
  <text x="94" y="357" font-size="15" font-weight="700" fill="#232a20" text-anchor="middle">瀏覽器</text>
  <text x="94" y="379" font-size="12.5" fill="#5b6354" text-anchor="middle">查詢字串</text>

  <line x1="158" y1="361" x2="232" y2="361" stroke="#5b6354" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="195" y="351" font-size="11.5" fill="#5b6354" text-anchor="middle">查詢</text>

  <!-- Worker -->
  <rect x="236" y="320" width="226" height="82" rx="12" fill="#e4ede6" stroke="#3f6b4f" stroke-width="1.6"/>
  <text x="349" y="349" font-size="15" font-weight="700" fill="#232a20" text-anchor="middle">Cloudflare Worker（邊緣）</text>
  <text x="349" y="370" font-size="12.5" fill="#2d5139" text-anchor="middle">V8 isolate・只做向量排序</text>
  <text x="349" y="389" font-size="11.5" fill="#5b6354" text-anchor="middle">冷啟動 ~5ms</text>

  <line x1="462" y1="361" x2="536" y2="361" stroke="#5b6354" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="499" y="351" font-size="11.5" fill="#5b6354" text-anchor="middle">算向量</text>

  <!-- NVIDIA -->
  <rect x="540" y="320" width="190" height="82" rx="12" fill="#e4eaef" stroke="#4f7fa0" stroke-width="1.6"/>
  <text x="635" y="353" font-size="15" font-weight="700" fill="#232a20" text-anchor="middle">NVIDIA 雲端</text>
  <text x="635" y="376" font-size="12.5" fill="#2c4f68" text-anchor="middle">Embedding 模型運算</text>

  <!-- VPS idle -->
  <rect x="236" y="458" width="226" height="72" rx="12" fill="#eceee6" stroke="#9aa38f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="349" y="487" font-size="15" font-weight="700" fill="#232a20" text-anchor="middle">我的 VPS</text>
  <text x="349" y="509" font-size="12" fill="#5b6354" text-anchor="middle">只放 search-index.json・完全不運算</text>

  <!-- VPS idle -> worker (讀索引) -->
  <line x1="349" y1="458" x2="349" y2="406" stroke="#5b6354" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="392" y="436" font-size="11.5" fill="#5b6354" text-anchor="middle">讀索引</text>

  <!-- build box -->
  <rect x="30" y="458" width="178" height="72" rx="12" fill="#fbfbf3" stroke="#5b6354" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="119" y="487" font-size="13.5" font-weight="700" fill="#232a20" text-anchor="middle">建置時 · GitHub Actions</text>
  <text x="119" y="509" font-size="11.5" fill="#5b6354" text-anchor="middle">算好向量 → 產生索引</text>

  <line x1="208" y1="494" x2="232" y2="494" stroke="#5b6354" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="220" y="484" font-size="11" fill="#5b6354" text-anchor="middle">部署</text>
</svg>
