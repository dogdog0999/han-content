<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <!-- 奶油色圓角底,深色模式也看得清 -->
  <rect x="0" y="0" width="720" height="416" rx="20" fill="#faf9f3"/>

  <defs>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6b4f"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f82"/>
    </marker>
  </defs>

  <!-- ===== 左:repo(公開) ===== -->
  <rect x="24" y="52" width="398" height="330" rx="14" fill="#ffffff" stroke="#3f6b4f" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="40" y="78" font-size="13" font-weight="700" fill="#3f6b4f">repo(公開)</text>
  <text x="128" y="78" font-size="11.5" fill="#5b6354">— 看得到架構，看不到 key 的值</text>

  <!-- json 單一真相 -->
  <rect x="48" y="150" width="150" height="86" rx="10" fill="#f1f0e6" stroke="#3f6b4f" stroke-width="1.6"/>
  <text x="123" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#232a1e">han-blog</text>
  <text x="123" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#232a1e">.workers.json</text>
  <text x="123" y="223" text-anchor="middle" font-size="10.5" fill="#5b6354">設定的單一真相</text>

  <!-- 三個 toml -->
  <g font-size="11.5">
    <rect x="256" y="104" width="150" height="54" rx="9" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.3"/>
    <text x="268" y="126" font-weight="700" fill="#232a1e">han-search</text>
    <text x="268" y="144" font-size="10" fill="#5b6354">wrangler.toml · [vars]</text>

    <rect x="256" y="167" width="150" height="54" rx="9" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.3"/>
    <text x="268" y="189" font-weight="700" fill="#232a1e">style-autofix</text>
    <text x="268" y="207" font-size="10" fill="#5b6354">wrangler.toml · [vars]</text>

    <rect x="256" y="230" width="150" height="54" rx="9" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.3"/>
    <text x="268" y="252" font-weight="700" fill="#232a1e">ai-video</text>
    <text x="268" y="270" font-size="10" fill="#5b6354">wrangler.toml · [vars]</text>
  </g>

  <!-- gen:workers 主幹 + 三分支(實線,值會落進 repo) -->
  <text x="227" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#3f6b4f">① gen:workers 烤進 [vars]</text>
  <path d="M198,193 L227,193" fill="none" stroke="#3f6b4f" stroke-width="1.6"/>
  <path d="M227,131 L227,257" fill="none" stroke="#3f6b4f" stroke-width="1.6"/>
  <path d="M227,131 L254,131" fill="none" stroke="#3f6b4f" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <path d="M227,194 L254,194" fill="none" stroke="#3f6b4f" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <path d="M227,257 L254,257" fill="none" stroke="#3f6b4f" stroke-width="1.6" marker-end="url(#arrGreen)"/>

  <!-- ===== 右:Cloudflare Secrets Store ===== -->
  <rect x="452" y="52" width="244" height="330" rx="14" fill="#eef3ee" stroke="#3f6b4f" stroke-width="1.6"/>
  <text x="468" y="78" font-size="13" font-weight="700" fill="#3f6b4f">Cloudflare Secrets Store</text>
  <text x="468" y="95" font-size="10.5" fill="#5b6354">值放在這，不進 repo</text>

  <!-- 共用的 AI key(金色強調);名稱皆化名,不露真實 env -->
  <rect x="468" y="110" width="212" height="40" rx="9" fill="#b98a3e"/>
  <text x="482" y="128" font-size="11.5" font-weight="700" fill="#ffffff">共用 AI key</text>
  <text x="482" y="143" font-size="9.5" fill="#f7eedd">三個 worker 共用，只建一次</text>

  <!-- 其餘 key(以功能化名代替真實名稱) -->
  <g font-size="11" fill="#232a1e">
    <rect x="468" y="160" width="212" height="30" rx="8" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.2"/>
    <text x="482" y="179">校正用 secret</text>
    <rect x="468" y="198" width="212" height="30" rx="8" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.2"/>
    <text x="482" y="217">文字模型 key</text>
    <rect x="468" y="236" width="212" height="30" rx="8" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.2"/>
    <text x="482" y="255">語音服務 key</text>
    <rect x="468" y="274" width="212" height="30" rx="8" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.2"/>
    <text x="482" y="293">觸發用 token</text>
    <rect x="468" y="312" width="212" height="30" rx="8" fill="#ffffff" stroke="#cdd5c7" stroke-width="1.2"/>
    <text x="482" y="331">部署用 token</text>
  </g>

  <!-- 綁定(虛線,只有名字過去,值留在右邊) -->
  <text x="429" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#5b6354">② 綁定:只有名字</text>
  <path d="M406,363 L452,363" fill="none" stroke="#8a8f82" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGrey)"/>
  <text x="256" y="367" font-size="10.5" fill="#8a8f82">各 toml 的 [[secrets_store_secrets]]</text>
</svg>
