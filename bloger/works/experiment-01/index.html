<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Experiment 01 — 獨立作品頁示範</title><meta name="description" content="這是一個 iso-page：不套用部落格的 masthead、側欄、配色，完全獨立。"><link rel="icon" type="image/svg+xml" href="/bloger/assets/logo.svg"></head><body><style>
  body { margin: 0; background: #0b0b10; color: #e8e8f0; font-family: system-ui, sans-serif; }
  .iso { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px; }
  .iso h1 { font-size: clamp(2rem, 8vw, 5rem); margin: 0; letter-spacing: -2px;
    background: linear-gradient(90deg, #7af7c0, #6aa6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .iso p { color: #9aa0b4; max-width: 40ch; }
  .iso a { color: #7af7c0; }
</style>
<div class="iso">
  <div>
    <h1 id="isopage">ISO PAGE</h1>
    <p>這頁用 <code>works/</code> collection，走 BaseLayout，<strong>完全沒有部落格樣式</strong>——隨你怎麼刻都行。</p>
    <p><a href="/bloger/">← 回 HAN 部落格</a></p>
  </div>
</div></body></html>
