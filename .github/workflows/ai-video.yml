name: AI 影片解說觸發

# 【只能手動】重掃「全部」有 ai-video-made 標籤的文章並重新生成 AI 影片。
# 平常 push 後的 AI 影片(只做這次改動的文章)已經在 publish.yml 的 ② 步驟,不用來這裡。
# 這支只在「播放器格式改了、要讓舊影片套新格式/字幕」這類情況手動跑。
# 注意:force 預設 true = 忽略快取、全部重做,會花 Claude + Google TTS 的錢,跑之前想清楚。
on:
  workflow_dispatch:
    inputs:
      force:
        description: 強制重生成(忽略快取)
        type: boolean
        default: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 要能跟上一個 commit 做 diff

      - name: 觸發有 ai-video-made 的變動文章
        env:
          WORKER_URL: ${{ secrets.AI_VIDEO_WORKER_URL }}       # 例:https://han-ai-video.xxx.workers.dev
          TRIGGER_TOKEN: ${{ secrets.AI_VIDEO_TRIGGER_TOKEN }} # 跟 Worker 的 TRIGGER_TOKEN 一致
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ] || [ -z "${TRIGGER_TOKEN:-}" ]; then
            echo "尚未設定 AI_VIDEO_WORKER_URL / AI_VIDEO_TRIGGER_TOKEN,略過。"; exit 0
          fi
          # 手動 Run 預設強制重生成;push 走快取
          FORCE=false
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${FORCE_INPUT:-true}" = "true" ]; then FORCE=true; fi
          # 手動 Run:重掃全部文章;push:只看這次改動的(core.quotepath=false 才不會把中文檔名變成 \xxx)
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            changed="$(find posts -name '*.md')"
          else
            before="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
            changed="$(git -c core.quotepath=false diff --name-only --diff-filter=AM "$before" HEAD -- 'posts/**/*.md' || true)"
          fi
          if [ -z "$changed" ]; then echo "沒有文章變動。"; exit 0; fi

          echo "$changed" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 只處理有 ai-video-made 標籤的(標籤寫在同一行 tags: [...])
            if ! grep -qE '^tags:.*ai-video-made' "$f"; then
              echo "跳過(無 ai-video-made):$f"; continue
            fi
            slug="${f#posts/}"; slug="${slug%.md}"
            echo "觸發生成:$slug (force=$FORCE)"
            # 連文章內容一起送,避免 Worker 去抓 raw 拿到快取舊版
            jq -n --arg slug "$slug" --rawfile content "$f" --argjson force "$FORCE" \
                 '{slug:$slug, content:$content, force:$force}' \
              | curl -sS -X POST "$WORKER_URL/generate" \
                  -H "x-trigger-token: $TRIGGER_TOKEN" \
                  -H "content-type: application/json" \
                  --data-binary @- -w ' → HTTP %{http_code}\n' || echo "  (這篇觸發失敗,略過)"
          done
