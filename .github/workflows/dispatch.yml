name: Notify site to deploy

# 文章一 push 到 main,就叫醒站台 repo vps-blogger 重新建置+佈署。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger vps-blogger deploy (repository_dispatch)
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dogdog0999/vps-blogger/dispatches \
            -d '{"event_type":"content-updated"}'
